services:
  migrate:
    build: .
    image: payment-ledger-local
    command: ["npm", "run", "prisma:deploy"]
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/ledger_db
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: payment-ledger-local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/ledger_db
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting the API}
      ALLOW_MOCK_SCENARIOS: ${ALLOW_MOCK_SCENARIOS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

  worker:
    build: .
    image: payment-ledger-local
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/ledger_db
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledger_db
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ledger_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
